[versions]
# AGP and tools should be updated together
agp = "9.3.1"
android-tools = "32.3.1"
android-compileSdk = "37"
# Store5's Android artifact declares API 24; keep consumers on its supported platform floor.
android-minSdk = "24"
android-targetSdk = "37"
androidDesugarJdkLibs = "2.1.5"
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
# 1.3.0-alphaNN, not stable 1.2.1: the web implementation (`WebLocalStorage`) landed in the alphas,
# and 1.2.1's wasmJs artifacts are stubs that throw. Drop to the stable line to give up web prefs.
androidx-datastore = "1.3.0-alpha10"
androidx-lifecycle = "2.11.0"
androidx-lint-gradle = "1.0.0"
androidx-test-runner = "1.7.0"
composeMultiplatform = "1.12.0"
# The standalone material3 train lags Compose Multiplatform; 1.9.0 is its latest stable.
composeMaterial3 = "1.9.0"
# Compose Multiplatform 1.12.0 ports Navigation3 UI 1.2.0-alpha02, based on AndroidX
# Navigation3 1.2.0-alpha04. AndroidX publishes the KMP runtime directly.
androidx-navigation3 = "1.2.0-alpha04"
jetbrains-navigation3 = "1.2.0-alpha02"
navigation3-browser = "1.1.0"
detekt = "2.0.0-alpha.6"
# Compiled against `dev.detekt:detekt-core`, so it has to track `detekt` exactly: 0.6.4 <-> alpha.6.
detektComposeRules = "0.6.4"
firebaseBom = "34.17.0"
firebaseCrashlyticsPlugin = "3.0.7"
firebasePerfPlugin = "2.0.2"
gmsPlugin = "4.5.0"
koinBom = "4.2.2"
kotlin = "2.4.10"
kotlinResult = "2.3.1"
kotlinx-coroutines = "1.11.0"
# Supplies the `Worker` and `Blob` externals the SQLDelight web-worker driver is handed on
# wasmJs. Kotlin/Wasm has no browser API in its stdlib, so this is not optional there.
kotlinx-browser = "0.5.0"
kotlinxSerialization = "1.11.0"
# Native desktop access to macOS Keychain, Windows DPAPI and Linux libsecret.
jna = "5.19.1"
# Pinned rather than left to Spotless's bundled default, which would otherwise reformat the whole
# repository as a side effect of a Spotless version bump.
ktfmt = "0.63"
ktor = "3.5.2"
spotless = "8.9.0"
# Room is the Android-recommended option but publishes no wasmJs target, so it cannot back a
# module built for `bkpTargets { default() }`. SQLDelight covers all four platforms.
sqldelight = "2.2.1"
# The docs currently show 5.1.0, but Maven has no stable artifact yet. alpha11 is the latest
# published release (2026-08-29).
store5 = "5.1.0-alpha11"
touchlabKermit = "2.1.0"
truth = "1.4.5"
turbine = "1.2.0"
tink = "1.23.0"

[libraries]

android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# `androidx.lifecycle`, not the `org.jetbrains.androidx.lifecycle` port: the port is a redirect stub
# now -- a 7KB klib that depends on this one -- and having both on a klib path collides their
# `unique_name`s. AndroidX publishes the wasmJs and iOS variants itself, `-navigation3` included.
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidx-navigation3" }
jetbrains-androidx-navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "jetbrains-navigation3" }
navigation3-browser = { group = "com.github.terrakok", name = "navigation3-browser", version.ref = "navigation3-browser" }
# The `-core` artifacts, not the `datastore`/`datastore-preferences` umbrellas: the umbrellas add
# Android-only conveniences this project does not use, and they publish no wasmJs variant.
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "androidx-datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-datastore-core-okio = { group = "androidx.datastore", name = "datastore-core-okio", version.ref = "androidx-datastore" }
# Encrypts DataStore serializers with Tink on Android and JVM.
androidx-datastore-tink = { group = "androidx.datastore", name = "datastore-tink", version.ref = "androidx-datastore" }
androidx-lifecycle-runtimeTesting = { group = "androidx.lifecycle", name = "lifecycle-runtime-testing", version.ref = "androidx-lifecycle" }
# Supplies the `AndroidJUnitRunner` the Android modules name as their instrumentation runner.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "composeMultiplatform" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-performance = { group = "com.google.firebase", name = "firebase-perf" }

koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koinBom" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
# `verify()` reflects over the graph, so this belongs in a JVM test source set even though the
# artifact publishes for every target.
koin-test = { group = "io.insert-koin", name = "koin-test" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# AGP 9's built-in Kotlin never consults `PowerAssertGradlePlugin`, so a pure-Android module has to
# put the compiler plugin on the task classpath itself and pull in the runtime the rewritten code
# calls into. The KMP plugin does both of these on its own.
kotlin-powerAssert-compilerPlugin = { group = "org.jetbrains.kotlin", name = "kotlin-power-assert-compiler-plugin-embeddable", version.ref = "kotlin" }
kotlin-powerAssert-runtime = { group = "org.jetbrains.kotlin", name = "kotlin-power-assert-runtime", version.ref = "kotlin" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlinx-browser = { group = "org.jetbrains.kotlinx", name = "kotlinx-browser", version.ref = "kotlinx-browser" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { group = "io.ktor", name = "ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# `async-extensions` is what makes `generateAsync` queries awaitable; `coroutines-extensions`
# turns a query into a `Flow` that re-emits when the tables it reads are written. Both are needed
# for a database-as-single-source-of-truth repository.
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-async-extensions = { group = "app.cash.sqldelight", name = "async-extensions", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
sqldelight-web-worker-driver = { group = "app.cash.sqldelight", name = "web-worker-driver", version.ref = "sqldelight" }

store5 = { group = "org.mobilenativefoundation.store", name = "store5", version.ref = "store5" }

michael-bull-kotlin-result = { group = "com.michael-bull.kotlin-result", name = "kotlin-result", version.ref = "kotlinResult" }

touchlab-kermit = { group = "co.touchlab", name = "kermit", version.ref = "touchlabKermit" }

turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Android Keystore-backed keyset management for the encrypted secrets store.
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
# Plain JVM Tink manages the desktop keyset and verifies the encrypted serializer in tests.
tink = { group = "com.google.crypto.tink", name = "tink", version.ref = "tink" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "android-tools" }
androidx-lint-gradle = { group = "androidx.lint", name = "lint-gradle", version.ref = "androidx-lint-gradle" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
detekt-composeRules = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "detektComposeRules" }
firebase-crashlytics-gradlePlugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "firebaseCrashlyticsPlugin" }
firebase-performance-gradlePlugin = { group = "com.google.firebase", name = "perf-plugin", version.ref = "firebasePerfPlugin" }
gms-gradlePlugin = { group = "com.google.gms", name = "google-services", version.ref = "gmsPlugin" }
jetbrains-compose-gradlePlugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "composeMultiplatform" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-powerAssert-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-power-assert", version.ref = "kotlin" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[bundles]
compose-android-main = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui-tooling-preview",
]
compose-common-main = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-components-resources",
    "compose-ui-tooling-preview",
]

