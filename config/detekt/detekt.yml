# `buildUponDefaultConfig` is on, so only deviations from detekt's defaults belong here -- anything
# restating a default is noise that has to be re-verified on every upgrade. Note that detekt's own
# defaults already cover most of what the Compose setup guides tell you to add (e.g. MagicNumber's
# `ignorePropertyDeclaration` / `ignoreCompanionObjectPropertyDeclaration`); check before adding.
#
# To see what a default actually is: move this file aside, run `./gradlew detektGenerateConfig`, and
# put it back. The generated file covers the third-party rulesets too.

coroutines:
  # `AppDispatchers` is the single place that names concrete dispatchers -- the seam the rule wants
  # everything else to inject -- so it is the one file that has to reference them directly.
  InjectDispatcher:
    excludes: ['**/dispatchers/AppDispatchers.kt']

complexity:
  LongParameterList:
    # Composables legitimately take many parameters, but almost all of them carry defaults. Discount
    # those rather than exempting `@Composable` wholesale, so a composable with a genuinely long list
    # of *required* parameters still gets flagged.
    ignoreDefaultParameters: true
  TooManyFunctions:
    # `@Preview`s are scaffolding, not API surface.
    ignoreAnnotatedFunctions: ['Preview']

naming:
  FunctionNaming:
    # Composables returning `Unit` are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose guidelines prescribe PascalCase for top-level constants, not SCREAMING_SNAKE_CASE.
    constantPattern: '[A-Z][A-Za-z0-9]*'

style:
  UnusedPrivateFunction:
    # `@Preview` functions are never called from code. Extend this list if we add multipreview
    # annotations of our own.
    ignoreAnnotated: ['Preview']
# The `Compose:` ruleset (io.nlopez.compose.rules) is deliberately absent: every entry we had was its
# shipped default. 36 of its 40 rules are active; `ComposableNestingDepth`, `Material2`,
# `PreviewNaming` and `UnstableCollections` are opt-in and stay off. Add a block only to deviate.
