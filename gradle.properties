#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# `linkReleaseFramework*` needs the headroom for whole-program devirtualization. Each link forks its
# own JVM of this size, so do not raise it without keeping KotlinNativeLinkThrottle -- concurrent
# links are what exhausts memory. 8g was needed before Kotlin 2.4.0 cut devirtualization peak memory;
# both release links now pass at 4g.
kotlin.native.jvmArgs=-Xmx4g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.parallel=true
