#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# `linkPodReleaseFramework*` OOMs below this. Each link forks its own JVM of this size, so do not
# raise it without keeping KotlinNativeLinkThrottle -- concurrent links are what exhausts memory.
kotlin.native.jvmArgs=-Xmx8g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.parallel=true
