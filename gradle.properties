#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# The release Kotlin/Native link runs whole-program devirtualization analysis, which needs more
# heap than the compiler's default. Without this, `linkPodReleaseFramework*` dies with an
# OutOfMemoryError. Each link is a separate process, so `bkp.kmp.lib` also serialises them --
# raising this further without that throttle makes things worse, not better.
kotlin.native.jvmArgs=-Xmx8g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Project isolation. Incubating, and the direction Gradle 10 is heading: a project may not read or
# mutate another project's model. Enabled now so violations fail here rather than at the upgrade --
# the whole build (config, assemble, test, iOS link) passes with it on. Drop this line to opt out.
org.gradle.isolated-projects=true
org.gradle.parallel=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
