#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# The release Kotlin/Native link runs whole-program devirtualization analysis, which needs more
# heap than the compiler's default. Without this, `linkPodReleaseFramework*` dies with an
# OutOfMemoryError. Each link is a separate process, so `bkp.kmp.lib` also serialises them --
# raising this further without that throttle makes things worse, not better.
kotlin.native.jvmArgs=-Xmx8g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true