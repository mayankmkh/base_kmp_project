#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# `linkReleaseFramework*` needs the headroom for whole-program devirtualization. Each link forks its
# own JVM of this size, so do not raise it without keeping KotlinNativeLinkThrottle -- concurrent
# links are what exhausts memory. 8g was needed before Kotlin 2.4.0 cut devirtualization peak memory;
# both release links now pass at 4g.
kotlin.native.jvmArgs=-Xmx4g
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Off because the web targets cannot coexist with it. KGP violates isolation twice on the way to a
# browser build: `browser()` pulls in a resolver plugin that applies a Node toolchain to the root
# project, and the JS/Wasm incremental-compilation build service reads the task graph across
# projects. Both are upstream; neither has a workaround on this side. Turn this back on -- and drop
# `bkpTargets.web()` with it -- the moment KGP stops doing either.
#
#     org.gradle.isolated-projects=true
#
# Everything the codebase did to earn isolation stays: `isolated.rootProject` in place of `rootDir`,
# per-project validation instead of an `allprojects` walk. Re-enabling is a one-line change.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
